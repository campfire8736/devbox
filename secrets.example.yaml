# Template for the encrypted secrets file.
#
# Do NOT fill this in and commit it. `scripts/bootstrap-secrets.sh` creates the
# real file, encrypts it with sops, and leaves this one untouched.
dev_password_hash: ""        # crypt hash of the `dev` login password
GITEA_HOST: ""               # e.g. http://gitea.local:8085
GITEA_TOKEN: ""              # Gitea PAT for the devbox (repo, issue, wiki, project)
GITHUB_PERSONAL_ACCESS_TOKEN: ""   # fine-grained PAT, read-only
OPENROUTER_API_KEY: ""
OPENCODE_SERVER_PASSWORD: ""       # basic-auth password for the web UI
